[package]
name = "cef"
description = "Use cef in Rust"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]

[[bin]]
name = "bundle-cef-app"

[features]
default = ["sandbox", "build-util", "resources"]
dox = ["cef-dll-sys/dox"]
sandbox = ["cef-dll-sys/sandbox"]
resources = []

# Unified texture import system for CEF hardware acceleration
accelerated_osr = [
    "ash",
    "libc",
    "objc2-foundation",
    "objc2-io-surface",
    "objc2-metal",
    "thiserror",
    "tracing",
    "wgpu",
    "windows",
]

# Build utilities, including the bundle-cef-app tool.
build-util = [
    "anyhow",
    "cargo_metadata",
    "clap",
    "plist",
    "semver",
    "serde",
    "serde_json",
    "thiserror",
]

# Linux X11 support in bundle-cef-app.
linux-x11 = []

[package.metadata.docs.rs]
features = ["dox"]

[dependencies]
cef-dll-sys.workspace = true

# accelerated_osr
ash = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

# bundle
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
cargo_metadata = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
windows = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, optional = true }
objc2-io-surface = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
plist = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
